[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    error
    # python-jose 3.3.0 usa datetime.utcnow(), depreciado no Python 3.12.
    # Nao ha versao corrigida publicada; o aviso e da biblioteca, nao nosso.
    ignore:datetime.datetime.utcnow:DeprecationWarning:jose.jwt
